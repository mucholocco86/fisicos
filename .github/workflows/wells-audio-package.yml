name: WELLS Audio experimental Windows package
on:
  push:
    branches: [feat/wells-audio-sndcpy-base]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 -o /tmp/cli.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cli.zip -d /tmp/cli
          mv /tmp/cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Wells Audio
        working-directory: wells-audio-android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wells-audio-apk
          path: wells-audio-android/app/build/outputs/apk/debug/app-debug.apk
  windows:
    needs: android
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qt5compat'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: wells-audio-apk
          path: android-apk
      - name: Embed official Wells Conect icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          from PIL import Image
          res=Path("upstream/QtScrcpy/QtScrcpy/res")
          image=Image.open(res/"wells_connect_icon.png").convert("RGBA")
          image.resize((256,256), Image.Resampling.LANCZOS).save(res/"QtScrcpy.ico",format="ICO",sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          image.save(res/"image"/"tray"/"logo.png")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure and compile Wells Conect
        shell: pwsh
        run: |
          cmake -S upstream/QtScrcpy -B build-core-qt6 -G "Visual Studio 17 2022" -A x64 -DQT_DESIRED_VERSION=6 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-core-qt6 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble experimental Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem upstream/QtScrcpy/output -Filter QtScrcpy.exe -Recurse | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (!$exe) { throw 'QtScrcpy.exe compilation missing' }
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item "$($exe.Directory.FullName)/*" dist -Recurse -Force
          Rename-Item dist/QtScrcpy.exe WellsConect.exe
          Copy-Item android-apk/app-debug.apk dist/wells-audio.apk -Force
          Remove-Item dist/sndcpy.apk,dist/sndcpy.bat,dist/sndcpy.sh -Force -ErrorAction SilentlyContinue
          Copy-Item upstream/QtScrcpy/QtScrcpy/sndcpy/wells_audio.bat dist/wells_audio.bat -Force
          Copy-Item upstream/QtScrcpy/config dist/config -Recurse -Force
          Copy-Item upstream/QtScrcpy/keymap dist/keymap -Recurse -Force
          Copy-Item upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/third_party/adb/win/* dist -Force
          Invoke-WebRequest 'https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-win64-v5.0.1.zip' -OutFile "$env:RUNNER_TEMP/scrcpy.zip"
          Expand-Archive "$env:RUNNER_TEMP/scrcpy.zip" "$env:RUNNER_TEMP/scrcpy" -Force
          $server = Get-ChildItem "$env:RUNNER_TEMP/scrcpy" -Filter scrcpy-server -Recurse -File | Select-Object -First 1
          if (!$server) { throw 'scrcpy-server not found' }
          Copy-Item $server.FullName dist/scrcpy-server
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime dist/WellsConect.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('WellsConect.exe','wells-audio.apk','wells_audio.bat','adb.exe','scrcpy-server','Qt6Multimedia.dll')) {
            if (!(Test-Path "dist/$file")) { throw "Missing: $file" }
          }
          Get-ChildItem dist -Recurse -File -Include *.pdb,*.lib,*.exp | Remove-Item -Force
      - uses: actions/upload-artifact@v4
        with:
          name: WELLS-CONECT-WELLS-AUDIO-EXPERIMENTAL
          path: dist/
          if-no-files-found: error
