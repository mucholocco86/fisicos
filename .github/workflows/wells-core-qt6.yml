name: WELLS CONECT - Nucleo real QtScrcpy Qt6
on:
  push:
    branches: [dev/wells-conect-qtscrcpy-core-qt6]
    paths:
      - '.github/workflows/wells-core-qt6.yml'
      - 'upstream/QtScrcpy/**'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Qt 6 para núcleo QtScrcpy sem navegador embutido
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qt5compat'
          cache: true
      - name: Conferir núcleo REAL de vídeo e controles
        shell: pwsh
        run: |
          $paths = @(
            'upstream/QtScrcpy/QtScrcpy/ui/videoform.cpp',
            'upstream/QtScrcpy/QtScrcpy/ui/toolform.cpp',
            'upstream/QtScrcpy/QtScrcpy/render/qyuvopenglwidget.cpp',
            'upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/device/device.cpp',
            'upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/device/controller/controller.cpp',
            'upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/device/decoder/decoder.cpp'
          )
          foreach($p in $paths) { if (!(Test-Path $p)) { throw "Núcleo real ausente: $p" } }
      - name: Conferir protocolo, controles e janelas do WELLS CONECT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $core = Get-Content upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/include/QtScrcpyCoreDef.h -Raw
          $server = Get-Content upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/device/server/server.h -Raw
          $dialog = Get-Content upstream/QtScrcpy/QtScrcpy/ui/dialog.cpp -Raw
          $tool = Get-Content upstream/QtScrcpy/QtScrcpy/ui/toolform.cpp -Raw
          $video = Get-Content upstream/QtScrcpy/QtScrcpy/ui/videoform.cpp -Raw
          if (!$core.Contains('serverVersion = "5.0.1"') -or !$server.Contains('serverVersion = "5.0.1"')) { throw 'Protocolo do servidor não é scrcpy 5.0.1' }
          if (!$dialog.Contains('ui->rightWidget->setParent(m_settingsWindow)') -or !$dialog.Contains('m_settingsWindow->show()')) { throw 'Configurações não utilizam os controles originais em janela separada' }
          if (!$dialog.Contains('ui->usbGroupBox') -or !$dialog.Contains('ui->wirelessGroupBox')) { throw 'Controles de conexão originais ausentes' }
          if (!$tool.Contains('ui->fullScreenBtn, ui->expandNotifyBtn, ui->rotateBtn') -or !$tool.Contains('ui->screenShotBtn, ui->appSwitchBtn') -or !$tool.Contains('m_gamepadBtn, m_keyboardBtn')) { throw 'Ordem dos controles do espelhamento diverge do modelo' }
          if (!$tool.Contains('m_muteBtn') -or !$tool.Contains('QStringLiteral("164")')) { throw 'Controle de mute ausente' }
          if ($video.Contains('new NativeMapperWindow(') -or $tool.Contains('m_keymapperBtn')) { throw 'ScrcpyKeyMapper ainda integrado à barra' }
          if (!$video.Contains('m_toolForm->useEmbeddedMode()')) { throw 'Barra do QtScrcpy não está integrada à janela do vídeo' }
          if (!$dialog.Contains('ui->simpleGroupBox->setTitle(QStringLiteral("Dispositivos"))')) { throw 'Rótulo Dispositivos não foi aplicado' }
          if (!$dialog.Contains('connect(m_settingsWindow, &QDialog::finished') -or !$dialog.Contains('m_settingsWindow->show()') -or !$dialog.Contains('hide();')) { throw 'Abertura/fechamento da janela de configurações divergente' }
          if (!$dialog.Contains('void Dialog::runWifiAdbStep') -or !$dialog.Contains('QStringLiteral("tcpip")') -or !$dialog.Contains('runWifiAdbStep({QStringLiteral("connect")')) { throw 'Fluxo Wi-Fi ADB não foi conectado' }
          if (!$tool.Contains('const QImage frame = device->captureFrame()') -or !$tool.Contains('WELLS Conect') -or !$tool.Contains('frame.save(fullPath, "PNG")')) { throw 'Screenshot nativo sem gravação e resultado' }
          if (!$tool.Contains('bool ToolForm::handlePhysicalKeyEvent') -or !$tool.Contains('NativeHid::input(NativeHid::KeyboardId, report)')) { throw 'Entrada UHID física não implementada' }
          if (!$video.Contains('m_toolForm->handlePhysicalKeyEvent(event)')) { throw 'Entrada de teclado não ligada ao painel de vídeo' }
          Write-Host 'Controles nativos e cinco correções pontuais WELLS verificados.'
      - name: Configurar QtScrcpy para Qt 6
        shell: pwsh
        run: |
          cmake -S upstream/QtScrcpy -B build-core-qt6 -G "Visual Studio 17 2022" -A x64 -DQT_DESIRED_VERSION=6 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar aplicativo real QtScrcpy com Qt 6
        shell: pwsh
        run: |
          cmake --build build-core-qt6 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Obter servidor Android scrcpy 5.0.1 oficial
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-win64-v5.0.1.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/scrcpy-5.0.1.zip"
          Expand-Archive "$env:RUNNER_TEMP/scrcpy-5.0.1.zip" "$env:RUNNER_TEMP/scrcpy-5.0.1" -Force
          $server = Get-ChildItem "$env:RUNNER_TEMP/scrcpy-5.0.1" -Filter 'scrcpy-server' -Recurse -File | Select-Object -First 1
          if (!$server -or $server.Length -lt 100000) { throw 'Servidor oficial scrcpy 5.0.1 não encontrado' }
          Copy-Item $server.FullName "$env:RUNNER_TEMP/wells-scrcpy-server-5.0.1"
          Write-Host ("Servidor scrcpy 5.0.1: " + (Get-FileHash $server.FullName -Algorithm SHA256).Hash)
      - name: Empacotar apenas se binário real foi compilado
        shell: pwsh
        run: |
          $exe = Get-ChildItem upstream/QtScrcpy/output -Filter QtScrcpy.exe -Recurse | Select-Object -First 1
          if (!$exe) { throw "QtScrcpy real não foi compilado" }
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item "$($exe.Directory.FullName)/*" dist -Recurse -Force
          Rename-Item dist/QtScrcpy.exe WellsConect.exe
          Copy-Item upstream/QtScrcpy/config dist/config -Recurse -Force
          Copy-Item upstream/QtScrcpy/keymap dist/keymap -Recurse -Force
          Copy-Item upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/third_party/adb/win/* dist -Force
          Copy-Item "$env:RUNNER_TEMP/wells-scrcpy-server-5.0.1" dist/scrcpy-server
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime dist/WellsConect.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($dependency in @('Qt6Core.dll','Qt6Gui.dll','Qt6Widgets.dll','Qt6OpenGL.dll','Qt6OpenGLWidgets.dll','Qt6Multimedia.dll','adb.exe','scrcpy-server','sndcpy.apk')) {
            if (!(Test-Path ("dist/" + $dependency))) { throw "Dependência obrigatória ausente: $dependency" }
          }
          if (!(Get-ChildItem dist -Filter 'avcodec-*.dll' -File)) { throw 'FFmpeg avcodec ausente' }
          if (!(Get-ChildItem dist -Filter 'avformat-*.dll' -File)) { throw 'FFmpeg avformat ausente' }
          if (Test-Path 'dist/scrcpy.exe') { throw 'Regressão: pacote contém motor externo em lugar de núcleo integrado' }
          Write-Host 'WellsConect.exe, DLLs do QtScrcpy, FFmpeg, ADB, sndcpy e scrcpy 5.0.1 presentes.'
          if ((Get-Item dist/scrcpy-server).Length -lt 100000) { throw 'scrcpy 5.0.1 não foi empacotado' }
          Get-ChildItem dist -Recurse -File -Include *.pdb,*.lib,*.exp | Remove-Item -Force
      - uses: actions/upload-artifact@v4
        with:
          name: WELLS-CONECT-QT6-SCRCPY-5.0.1-CORRECOES-WINDOWS
          path: dist/
          if-no-files-found: error
