name: WELLS CONECT - Nucleo real QtScrcpy Qt6
on:
  push:
    branches: [release/wells-conect-icone-definitivo, fix/wells-conect-audio-config-apk-icon]
    paths:
      - '.github/workflows/wells-core-qt6.yml'
      - 'upstream/QtScrcpy/**'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Qt 6 para núcleo QtScrcpy sem navegador embutido
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qt5compat'
          cache: true
      - name: Conferir núcleo REAL de vídeo e controles
        shell: pwsh
        run: |
          $paths = @(
            'upstream/QtScrcpy/QtScrcpy/ui/videoform.cpp',
            'upstream/QtScrcpy/QtScrcpy/ui/toolform.cpp',
            'upstream/QtScrcpy/QtScrcpy/render/qyuvopenglwidget.cpp',
            'upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/device/device.cpp',
            'upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/device/controller/controller.cpp',
            'upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/device/decoder/decoder.cpp'
          )
          foreach($p in $paths) { if (!(Test-Path $p)) { throw "Núcleo real ausente: $p" } }
      - name: Conferir protocolo, controles e janelas do WELLS CONECT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $core = Get-Content upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/include/QtScrcpyCoreDef.h -Raw
          $server = Get-Content upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/device/server/server.h -Raw
          $dialog = Get-Content upstream/QtScrcpy/QtScrcpy/ui/dialog.cpp -Raw
          $tool = Get-Content upstream/QtScrcpy/QtScrcpy/ui/toolform.cpp -Raw
          $video = Get-Content upstream/QtScrcpy/QtScrcpy/ui/videoform.cpp -Raw
          if (!$core.Contains('serverVersion = "5.0.1"') -or !$server.Contains('serverVersion = "5.0.1"')) { throw 'Protocolo do servidor não é scrcpy 5.0.1' }
          if (!$dialog.Contains('ui->rightWidget->setParent(m_settingsWindow)') -or !$dialog.Contains('m_settingsWindow->show()')) { throw 'Configurações não utilizam os controles originais em janela separada' }
          if (!$dialog.Contains('ui->usbGroupBox') -or !$dialog.Contains('ui->wirelessGroupBox')) { throw 'Controles de conexão originais ausentes' }
          if (!$tool.Contains('ui->fullScreenBtn, ui->expandNotifyBtn, ui->rotateBtn') -or !$tool.Contains('ui->screenShotBtn, ui->appSwitchBtn') -or !$tool.Contains('m_gamepadBtn, m_keyboardBtn')) { throw 'Ordem dos controles do espelhamento diverge do modelo' }
          if (!$tool.Contains('m_muteBtn') -or !$tool.Contains('QStringLiteral("164")')) { throw 'Controle de mute ausente' }
          if ($video.Contains('new NativeMapperWindow(') -or $tool.Contains('m_keymapperBtn')) { throw 'ScrcpyKeyMapper ainda integrado à barra' }
          if (!$video.Contains('m_toolForm->useEmbeddedMode()')) { throw 'Barra do QtScrcpy não está integrada à janela do vídeo' }
          if (!$dialog.Contains('ui->simpleGroupBox->setTitle(QStringLiteral("Dispositivos"))')) { throw 'Rótulo Dispositivos não foi aplicado' }
          if (!$dialog.Contains('connect(m_settingsWindow, &QDialog::finished') -or !$dialog.Contains('m_settingsWindow->show()') -or !$dialog.Contains('hide();')) { throw 'Abertura/fechamento da janela de configurações divergente' }
          if (!$dialog.Contains('void Dialog::runWifiAdbStep') -or !$dialog.Contains('QStringLiteral("tcpip")') -or !$dialog.Contains('runWifiAdbStep({QStringLiteral("connect")')) { throw 'Fluxo Wi-Fi ADB não foi conectado' }
          if (!$tool.Contains('const QImage frame = device->captureFrame()') -or !$tool.Contains('WELLS Conect') -or !$tool.Contains('frame.save(fullPath, "PNG")')) { throw 'Screenshot nativo sem gravação e resultado' }
          if (!$tool.Contains('bool ToolForm::handlePhysicalKeyEvent') -or !$tool.Contains('NativeHid::input(NativeHid::KeyboardId, report)')) { throw 'Entrada UHID física não implementada' }
          if (!$video.Contains('m_toolForm->handlePhysicalKeyEvent(event)')) { throw 'Entrada de teclado não ligada ao painel de vídeo' }
          Write-Host 'Controles nativos e cinco correções pontuais WELLS verificados.'
      - name: Incorporar ícone WELLS CONECT aprovado (Windows e bandeja)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          from PIL import Image
          res = Path("upstream/QtScrcpy/QtScrcpy/res")
          source = res / "wells_connect_icon.png"
          if not source.is_file():
              raise RuntimeError("Ícone aprovado ausente do código-fonte")
          original = Image.open(source).convert("RGBA")
          if original.width != original.height or original.width < 128:
              raise RuntimeError("Fonte do ícone incorreta")
          # Embute múltiplas resoluções no PE do Windows, inclusive 256px.
          large = original.resize((256, 256), Image.Resampling.LANCZOS)
          large.save(res / "QtScrcpy.ico", format="ICO",
                     sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          # O mesmo desenho passa a ser usado pelo Qt e pela bandeja do sistema.
          original.save(res / "image" / "tray" / "logo.png", format="PNG")
          with Image.open(res / "QtScrcpy.ico") as ico:
              assert ico.size == (256, 256), "Falha na geração do ícone .ico"
          print("Ícone WELLS integrado ao recurso Windows e ao logo Qt.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configurar QtScrcpy para Qt 6
        shell: pwsh
        run: |
          cmake -S upstream/QtScrcpy -B build-core-qt6 -G "Visual Studio 17 2022" -A x64 -DQT_DESIRED_VERSION=6 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar aplicativo real QtScrcpy com Qt 6
        shell: pwsh
        run: |
          cmake --build build-core-qt6 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Obter servidor Android scrcpy 5.0.1 oficial
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-win64-v5.0.1.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/scrcpy-5.0.1.zip"
          Expand-Archive "$env:RUNNER_TEMP/scrcpy-5.0.1.zip" "$env:RUNNER_TEMP/scrcpy-5.0.1" -Force
          $server = Get-ChildItem "$env:RUNNER_TEMP/scrcpy-5.0.1" -Filter 'scrcpy-server' -Recurse -File | Select-Object -First 1
          if (!$server -or $server.Length -lt 100000) { throw 'Servidor oficial scrcpy 5.0.1 não encontrado' }
          Copy-Item $server.FullName "$env:RUNNER_TEMP/wells-scrcpy-server-5.0.1"
          Write-Host ("Servidor scrcpy 5.0.1: " + (Get-FileHash $server.FullName -Algorithm SHA256).Hash)
      - name: Empacotar apenas se binário real foi compilado
        shell: pwsh
        run: |
          $exe = Get-ChildItem upstream/QtScrcpy/output -Filter QtScrcpy.exe -Recurse | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          Write-Host "Selecting compiled application: $($exe.FullName)"
          if (!$exe) { throw "QtScrcpy real não foi compilado" }
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item "$($exe.Directory.FullName)/*" dist -Recurse -Force
          Copy-Item upstream/QtScrcpy/QtScrcpy/res/wells_connect_icon.png dist/WELLS_CONECT_ICON.png -Force
          Copy-Item upstream/QtScrcpy/QtScrcpy/res/QtScrcpy.ico dist/WELLS_CONECT_ICON.ico -Force
          # Validate that the icon is actually embedded in the compiled Windows PE,
          # not merely placed beside the executable as an .ico file.
          $exeHash = (Get-FileHash dist/QtScrcpy.exe -Algorithm SHA256).Hash
          Write-Host "Compiled exe SHA256: $exeHash"
          Rename-Item dist/QtScrcpy.exe WellsConect.exe
          Copy-Item upstream/QtScrcpy/config dist/config -Recurse -Force
          Copy-Item upstream/QtScrcpy/keymap dist/keymap -Recurse -Force
          Copy-Item upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/third_party/adb/win/* dist -Force
          Copy-Item "$env:RUNNER_TEMP/wells-scrcpy-server-5.0.1" dist/scrcpy-server
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime dist/WellsConect.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($dependency in @('Qt6Core.dll','Qt6Gui.dll','Qt6Widgets.dll','Qt6OpenGL.dll','Qt6OpenGLWidgets.dll','Qt6Multimedia.dll','adb.exe','scrcpy-server','sndcpy.apk')) {
            if (!(Test-Path ("dist/" + $dependency))) { throw "Dependência obrigatória ausente: $dependency" }
          }
          # Qt Multimedia requires its runtime backend in addition to Qt6Multimedia.dll.
          $mediaBackends = Get-ChildItem dist -Recurse -Filter '*mediaplugin*.dll' -File -ErrorAction SilentlyContinue
          $ffmpegBackend = Get-ChildItem dist -Recurse -Filter 'ffmpegmediaplugin.dll' -File -ErrorAction SilentlyContinue
          $windowsBackend = Get-ChildItem dist -Recurse -Filter 'windowsmediaplugin.dll' -File -ErrorAction SilentlyContinue
          if (!$mediaBackends -and !$ffmpegBackend -and !$windowsBackend) {
            Write-Warning 'No Qt Multimedia backend plugin was found; sndcpy playback may be unavailable.'
          }
          if (!(Get-ChildItem dist -Filter 'avcodec-*.dll' -File)) { throw 'FFmpeg avcodec ausente' }
          if (!(Get-ChildItem dist -Filter 'avformat-*.dll' -File)) { throw 'FFmpeg avformat ausente' }
          if (Test-Path 'dist/scrcpy.exe') { throw 'Regressão: pacote contém motor externo em lugar de núcleo integrado' }
          Write-Host 'WellsConect.exe, DLLs do QtScrcpy, FFmpeg, ADB, sndcpy e scrcpy 5.0.1 presentes.'
          if ((Get-Item dist/scrcpy-server).Length -lt 100000) { throw 'scrcpy 5.0.1 não foi empacotado' }
          Get-ChildItem dist -Recurse -File -Include *.pdb,*.lib,*.exp | Remove-Item -Force
      - name: Personalizar ícone do sndcpy.apk sem alterar seu código Java
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Apktool recompila recursos; o pacote precisa de nova assinatura Android.
          $apk = 'dist/sndcpy.apk'
          $originalApkHash = (Get-FileHash $apk -Algorithm SHA256).Hash
          Write-Host "Original APK SHA256: $originalApkHash"
          if (!(Test-Path $apk)) { throw 'sndcpy.apk original ausente' }
          Invoke-WebRequest 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -OutFile "$env:RUNNER_TEMP/apktool.jar"
          java -jar "$env:RUNNER_TEMP/apktool.jar" d -f $apk -o "$env:RUNNER_TEMP/sndcpy-decoded"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao decodificar sndcpy.apk' }
          @'
          from pathlib import Path
          from PIL import Image
          import re
          root = Path(__import__('os').environ['RUNNER_TEMP']) / 'sndcpy-decoded'
          manifest = (root / 'AndroidManifest.xml').read_text(encoding='utf-8')
          m = re.search(r'android:icon="@(mipmap|drawable)/([a-zA-Z0-9_]+)"', manifest)
          if not m:
              raise RuntimeError('Ícone Android não identificado; preservando APK em vez de alterar recurso errado')
          kind, name = m.groups()
          original = Image.open('upstream/QtScrcpy/QtScrcpy/res/wells_connect_icon.png').convert('RGBA')
          matches = list((root / 'res').glob(f'{kind}*/{name}.png')) + list((root / 'res').glob(f'{kind}*/{name}.webp'))
          if not matches:
              raise RuntimeError(f'Ícone {kind}/{name} não tem recursos de imagem diretos; requer tratamento específico')
          for path in matches:
              with Image.open(path) as target:
                  size = target.size
              original.resize(size, Image.Resampling.LANCZOS).save(path, format='PNG')
              if path.suffix == '.webp':
                  # Preserve original resource format and extension.
                  original.resize(size, Image.Resampling.LANCZOS).save(path, format='WEBP', lossless=True)
          print('Recursos do ícone substituídos:', len(matches))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao substituir recursos do ícone' }
          java -jar "$env:RUNNER_TEMP/apktool.jar" b "$env:RUNNER_TEMP/sndcpy-decoded" -o "$env:RUNNER_TEMP/sndcpy-unsigned.apk"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao reconstruir sndcpy.apk' }
          $buildTools = Get-ChildItem "$env:ANDROID_HOME/build-tools" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (!$buildTools) { throw 'Android build-tools não encontrados' }
          $zipalign = Join-Path $buildTools.FullName 'zipalign.exe'
          $apksigner = Join-Path $buildTools.FullName 'apksigner.bat'
          & $zipalign -f -p 4 "$env:RUNNER_TEMP/sndcpy-unsigned.apk" "$env:RUNNER_TEMP/sndcpy-aligned.apk"
          if ($LASTEXITCODE -ne 0) { throw 'zipalign falhou' }
          keytool -genkeypair -keystore "$env:RUNNER_TEMP/wells-sndcpy.keystore" -storepass changeit -keypass changeit -alias wells-sndcpy -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Wells Conect,O=Wells,C=BR'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar assinatura' }
          & $apksigner sign --ks "$env:RUNNER_TEMP/wells-sndcpy.keystore" --ks-pass pass:changeit --key-pass pass:changeit --out $apk "$env:RUNNER_TEMP/sndcpy-aligned.apk"
          if ($LASTEXITCODE -ne 0) { throw 'Assinatura do APK falhou' }
          & $apksigner verify --verbose $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK personalizado não passou na verificação de assinatura' }
          $newApkHash = (Get-FileHash $apk -Algorithm SHA256).Hash
          if ($newApkHash -eq $originalApkHash) { throw 'APK personalizado é idêntico ao APK original' }
          Write-Host "Personalized APK SHA256: $newApkHash"
          Write-Host 'AVISO: APK reassinado. Se o original estiver instalado, desinstale com adb uninstall com.rom1v.sndcpy antes de instalar a nova versão.'
      - uses: actions/upload-artifact@v4
        with:
          name: WELLS-CONECT-CORRECOES-AUDIO-WINDOWS
          path: dist/
          if-no-files-found: error
