name: QtScrcpy PT-BR integrado - Pacote Windows de testes
run-name: Gerar QtScrcpy + ScrcpyKeyMapper para teste fisico
on:
  workflow_dispatch:
  push:
    branches: [dev/qtscrcpy-scrcpykeymapper-teste]
    paths:
      - '.github/workflows/build-public-test.yml'

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 95
    steps:
      - name: Obter customizacoes no fisicos
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Importar fontes originais e aplicar exclusivamente nossas alteracoes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $overlay = Join-Path $env:RUNNER_TEMP 'custom-ptbr'
          New-Item -ItemType Directory -Path $overlay -Force | Out-Null
          Copy-Item upstream -Destination $overlay -Recurse -Force
          git config --global 'url.https://github.com/.insteadOf' 'git@github.com:'
          git clone --depth 1 --branch v4.2.1 https://github.com/barry-ran/QtScrcpy.git "$env:RUNNER_TEMP/QtScrcpy-original"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao obter QtScrcpy 4.2.1' }
          git -C "$env:RUNNER_TEMP/QtScrcpy-original" submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao obter submodulo publico QtScrcpyCore por HTTPS' }
          git clone https://github.com/w4po/ScrcpyKeyMapper.git "$env:RUNNER_TEMP/ScrcpyKeyMapper-original"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao obter ScrcpyKeyMapper original' }
          git -C "$env:RUNNER_TEMP/ScrcpyKeyMapper-original" checkout 022870e2caf905046c8e7502d4053bb5f171c1e4
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel fixar revisao do ScrcpyKeyMapper' }
          Remove-Item upstream -Recurse -Force
          New-Item -ItemType Directory upstream/QtScrcpy, upstream/ScrcpyKeyMapper -Force | Out-Null
          & robocopy "$env:RUNNER_TEMP/QtScrcpy-original" upstream/QtScrcpy /E /XD .git
          if ($LASTEXITCODE -ge 8) { throw 'Falha copiando QtScrcpy oficial' }
          & robocopy "$env:RUNNER_TEMP/ScrcpyKeyMapper-original" upstream/ScrcpyKeyMapper /E /XD .git
          if ($LASTEXITCODE -ge 8) { throw 'Falha copiando ScrcpyKeyMapper oficial' }
          foreach ($file in (Get-ChildItem (Join-Path $overlay 'upstream') -File -Recurse)) {
            $rel = $file.FullName.Substring((Join-Path $overlay 'upstream').Length).TrimStart([char]92, [char]47)
            $dest = Join-Path upstream $rel
            New-Item -ItemType Directory (Split-Path $dest) -Force | Out-Null
            Copy-Item $file.FullName $dest -Force
          }
          if (!(Test-Path upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/device/server/server.h)) { throw 'QtScrcpyCore nao presente' }
          if (!(Test-Path upstream/QtScrcpy/QtScrcpy/ui/nativemapperwindow.cpp)) { throw 'Janela integrada nao presente' }
          if (!(Test-Path upstream/ScrcpyKeyMapper/js/native-bridge.js)) { throw 'Ponte do mapeador nao presente' }
          git config user.name "fisicos-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Importar codigo-fonte QtScrcpy 4.2.1 e ScrcpyKeyMapper original com adaptacoes"
            if ($LASTEXITCODE -ne 0) { throw 'Falha no commit das fontes' }
            git push origin HEAD:dev/qtscrcpy-scrcpykeymapper-teste
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao transferir projeto completo ao repositorio' }
          }
          $global:LASTEXITCODE = 0

      - name: Instalar Qt para compilacao Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtwebengine'
          cache: true

      - name: Preparar bibliotecas do editor para funcionamento offline
        shell: pwsh
        run: |
          ./scripts/prepare-mapper-assets.ps1 -Root upstream/ScrcpyKeyMapper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Conferir versao original do servidor Android
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serverHeader = 'upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/device/server/server.h'
          $serverFile = 'upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/third_party/scrcpy-server'
          if (!(Test-Path $serverFile)) { throw 'scrcpy-server original ausente' }
          if (!(Select-String -Path $serverHeader -Pattern 'serverVersion = "4.1"' -SimpleMatch -Quiet)) {
            throw 'Servidor esperado v4.1 nao encontrado'
          }
          Write-Host "Servidor Android original: scrcpy-server 4.1"

      - name: Conferir requisitos de interface antes de compilar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $main = Get-Content upstream/QtScrcpy/QtScrcpy/ui/dialog.cpp -Raw
          $video = Get-Content upstream/QtScrcpy/QtScrcpy/ui/videoform.cpp -Raw
          $mapper = Get-Content upstream/QtScrcpy/QtScrcpy/ui/nativemapperwindow.cpp -Raw
          $css = Get-Content upstream/ScrcpyKeyMapper/css/embedded-panel.css -Raw
          $bridge = Get-Content upstream/ScrcpyKeyMapper/js/native-bridge.js -Raw
          $mainUi = Get-Content upstream/QtScrcpy/QtScrcpy/ui/dialog.ui -Raw
          $config = Get-Content upstream/QtScrcpy/QtScrcpy/util/config.cpp -Raw
          if ($main.Contains('mainWindowScroll') -or $main.Contains('const QSize initialSize = QSize(920, 620)')) { throw 'Regressao: painel principal ainda contem redimensionamento forçado' }
          if (!$mainUi.Contains('<width>1293</width>') -or !$mainUi.Contains('<height>502</height>')) { throw 'Tamanho original de fabrica do painel principal nao restaurado' }
          if (!$main.Contains('    adjustSize();')) { throw 'Comportamento oficial do modo simples nao restaurado' }
          if (!$config.Contains('COMMON_BITRATE_DEF 8000000')) { throw 'Perfil inicial de video 8 Mbps ausente' }
          Write-Host 'Painel principal: layout oficial 4.2.1, PT-BR e identidade vermelha preservados.'
          if (!$video.Contains('useEmbeddedMode()') -or !$video.Contains('setGeometry(width() - 34')) { throw 'Barra nao incorporada' }
          if (!$video.Contains('margins.setRight(margins.right() + 44)') -or !$video.Contains('const int toolbarWidth = show_toolbar ? 34 : 0;') -or !$video.Contains('const int toolbarGap = show_toolbar ? 10 : 0;') -or !$video.Contains('const int toolbarReserve = toolbarWidth + toolbarGap;')) { throw 'Margem de 10px para barra nao preservada na rotacao' }
          if (!$video.Contains('const QSize outerLimit(qMax(1, outerWidth - toolbarWidth)') -or $video.Contains('qMin(920, screenRect.width()) - toolbarReserve')) { throw 'Regressao: largura do video comprimida pelo espaco de 10px' }
          $input = Get-Content upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/device/controller/inputconvert/inputconvertnormal.cpp -Raw
          if (!$input.Contains('typedText.at(0).unicode() > 0x7f') -or !$input.Contains('ControlMsg::CMT_INJECT_TEXT') -or !$input.Contains('if (!shortcut && specialText)')) { throw 'Regressao: texto PT-BR nao usa protocolo nativo do scrcpy' }
          Write-Host 'Entrada PT-BR: texto Unicode e pontuacao preservados no canal de controle scrcpy.'
          $tool = Get-Content upstream/QtScrcpy/QtScrcpy/ui/toolform.cpp -Raw
          if (!$tool.Contains('button->setFocusPolicy(Qt::NoFocus)') -or !$tool.Contains('video->setFocus(Qt::OtherFocusReason)')) { throw 'Botao de teclado pode capturar a barra de espaco' }
          if (!$mapper.Contains('mapperApplyScreenshotData')) { throw 'Transferencia direta de screenshot ausente' }
          if (!$bridge.Contains('tela-atual-celular.png')) { throw 'Injecao automatica de screenshot ausente' }
          if (!$css.Contains('grid-template-columns: minmax(165px')) { throw 'Editor sem tres areas visiveis' }
          Write-Host 'Verificacoes estaticas de interface aprovadas. Teste fisico permanece obrigatorio.'

      - name: Configurar compilacao
        shell: pwsh
        run: |
          cmake -S upstream/QtScrcpy -B build -G "Visual Studio 17 2022" -A x64 -DQT_DESIRED_VERSION=5 -DCMAKE_PREFIX_PATH="$env:QTDIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar QtScrcpy com janela integrada
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Montar pacote portatil com todas as dependencias
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'upstream/QtScrcpy/output/x64/RelWithDebInfo'
          if (!(Test-Path "$source/QtScrcpy.exe")) {
            $source = 'upstream/QtScrcpy/output/x64/Release'
          }
          if (!(Test-Path "$source/QtScrcpy.exe")) { throw 'QtScrcpy.exe nao gerado' }
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item "$source/*" dist -Recurse -Force
          Copy-Item upstream/QtScrcpy/config dist/config -Recurse -Force
          Copy-Item upstream/QtScrcpy/keymap dist/keymap -Recurse -Force
          Copy-Item upstream/ScrcpyKeyMapper dist/ScrcpyKeyMapper -Recurse -Force
          # Exemplos e imagens de documentacao nao sao usados em tempo de execucao.
          Remove-Item dist/ScrcpyKeyMapper/examples -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist/ScrcpyKeyMapper/.github -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist/ScrcpyKeyMapper/assets/screenshot.png -Force -ErrorAction SilentlyContinue
          Copy-Item upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/third_party/adb/win/* dist -Force
          Copy-Item upstream/QtScrcpy/QtScrcpy/QtScrcpyCore/src/third_party/scrcpy-server dist/scrcpy-server -Force
          & (Get-Command windeployqt.exe -ErrorAction Stop).Source --release --compiler-runtime dist/QtScrcpy.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/ScrcpyKeyMapper/vendor/konva.min.js)) { throw 'Biblioteca Konva ausente' }
          if (!(Test-Path dist/adb.exe)) { throw 'ADB ausente' }
          if (!(Test-Path dist/scrcpy-server)) { throw 'Servidor ausente' }
          if (!(Get-ChildItem dist -Recurse -File -Filter QtWebEngineProcess.exe)) { throw 'QtWebEngineProcess.exe ausente' }
          if (!(Test-Path dist/Qt5Core.dll)) { throw 'Qt5 nao encontrado no pacote' }
          if (Test-Path dist/Qt6Core.dll) { throw 'Qt6 indevidamente incluso' }
          # Somente recursos de idioma necessarios ao aplicativo PT-BR.
          $localeDir = 'dist/translations/qtwebengine_locales'
          if (Test-Path $localeDir) {
            Get-ChildItem $localeDir -Filter '*.pak' | Where-Object { $_.Name -notin @('pt-BR.pak','en-US.pak') } | Remove-Item -Force
          }
          Remove-Item dist/resources/qtwebengine_devtools_resources.pak -Force -ErrorAction SilentlyContinue
          Get-ChildItem dist -Recurse -File -Include *.lib,*.exp,*.pdb | Remove-Item -Force
          # Diagnostico de tamanho para identificar DLLs ou dependencias redundantes.
          Get-ChildItem dist -File -Recurse | Sort-Object Length -Descending | Select-Object -First 35 FullName, Length | Format-Table -AutoSize
          Get-ChildItem dist -File -Recurse | ForEach-Object { [PSCustomObject]@{ path = $_.FullName.Substring((Resolve-Path dist).Path.Length + 1); bytes = $_.Length } } | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 dist/manifesto-tamanhos.json

      - name: Publicar artefato ZIP para download
        uses: actions/upload-artifact@v4
        with:
          name: QtScrcpy-PTBR-Mapper-TESTE-Windows
          # O proprio actions/upload-artifact gera UM ZIP; nao encapsular ZIP em ZIP.
          path: dist/
          if-no-files-found: error
          retention-days: 14
