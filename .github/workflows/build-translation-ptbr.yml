name: QtScrcpy original - tradução PT-BR
on:
  workflow_dispatch:
  push:
    branches: [dev/qtscrcpy-traducao-ptbr, dev/etapa-barra-espelhamento]
    paths:
      - 'upstream/QtScrcpy/QtScrcpy/res/i18n/pt_BR.ts'
      - 'upstream/QtScrcpy/QtScrcpy/res/res.qrc'
      - 'upstream/QtScrcpy/QtScrcpy/CMakeLists.txt'
      - 'upstream/ScrcpyKeyMapper/index.html'
      - 'upstream/QtScrcpy/QtScrcpy/main.cpp'
      - 'upstream/QtScrcpy/QtScrcpy/ui/dialog.cpp'
      - 'upstream/QtScrcpy/QtScrcpy/ui/toolform.cpp'
      - 'upstream/QtScrcpy/QtScrcpy/ui/toolform.h'
      - 'upstream/QtScrcpy/QtScrcpy/util/config.cpp'
      - 'upstream/QtScrcpy/config/config.ini'
      - 'upstream/ScrcpyKeyMapper/js/i18n/pt_BR.js'
      - 'upstream/ScrcpyKeyMapper/js/managers/LanguageManager.js'
      - '.github/workflows/build-translation-ptbr.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Qt original para compilar QtScrcpy
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qttools'
          cache: true
      - name: Gerar tradução PT-BR oficial do Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ts='upstream/QtScrcpy/QtScrcpy/res/i18n/pt_BR.ts'
          $qm='upstream/QtScrcpy/QtScrcpy/res/i18n/pt_BR.qm'
          $exe=Join-Path $env:QTDIR 'bin/lrelease.exe'
          if (-not (Test-Path $exe)) {
            $exe = (Get-Command lrelease.exe -ErrorAction Stop).Source
          }
          & $exe $ts -qm $qm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $qm)) { throw 'Tradução pt_BR.qm não criada' }
          Write-Host "Tradução PT-BR compilada:" (Get-Item $qm).Length "bytes"
      - name: Configurar código original QtScrcpy
        shell: pwsh
        run: |
          cmake -S upstream/QtScrcpy -B build -G "Visual Studio 17 2022" -A x64 -DQT_DESIRED_VERSION=6 -DCMAKE_PREFIX_PATH="$env:QTDIR" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar QtScrcpy original com textos PT-BR
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Empacotar sem modificar a base funcional
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src='upstream/QtScrcpy/output/x64/Release'
          if (!(Test-Path "$src/QtScrcpy.exe")) { throw 'QtScrcpy.exe não encontrado' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "$src/*" dist -Recurse -Force
          & (Get-Command windeployqt.exe -ErrorAction Stop).Source --release --compiler-runtime --no-translations dist/QtScrcpy.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item upstream/QtScrcpy/config dist/config -Recurse -Force
          Copy-Item upstream/QtScrcpy/keymap dist/keymap -Recurse -Force
          Copy-Item upstream/ScrcpyKeyMapper dist/ScrcpyKeyMapper-source -Recurse -Force
          Compress-Archive -Path 'dist/*' -DestinationPath 'QtScrcpy-Original-Traducao-PTBR.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: QtScrcpy-Original-Traducao-PTBR
          path: QtScrcpy-Original-Traducao-PTBR.zip
          if-no-files-found: error
