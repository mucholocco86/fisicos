[common]
; Idioma: Auto=automático, zh_CN=chinês, en_US=inglês, pt_BR=português brasileiro
Language=pt_BR
; Título da janela
WindowTitle=QtScrcpy
; Pasta de destino dos arquivos no Android (deve terminar com /)
PushFilePath=/sdcard/
; FPS máximo (disponível em Android 10 ou posterior)
MaxFps=0
; Renderização dos quadros atrasados (ignorá-los reduz a latência)
RenderExpiredFrames=0
; Decodificação de vídeo: -1 automática, 0 software, 1 DirectX, 2 OpenGL
UseDesktopOpenGL=-1
; Caminho do servidor scrcpy copiado para o Android
ServerPath=/data/local/tmp/scrcpy-server.jar
; Caminho personalizado do ADB, por exemplo: D:/android/tools/adb.exe
AdbPath=
; Opções do codificador: "" usa o valor padrão
; Exemplo: CodecOptions="profile=1,level=2"
; Mais opções: https://d.android.com/reference/android/media/MediaFormat
CodecOptions=""
; Nome do codificador (deve ser H.264); "" usa o padrão
; Exemplo: CodecName="OMX.qcom.video.encoder.avc"
CodecName=""

; Nível de registro (verbose, debug, info, warn, error)
LogLevel=verbose
